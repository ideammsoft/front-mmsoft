# 에러 페이지 등에 nginx 버전이 노출되지 않도록 숨김
# (호스트 nginx는 /etc/nginx/nginx.conf 에서 별도로 off 처리됨)
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # 업스트림 이름을 요청 시점에 해석 (Docker 내장 DNS)
    #
    # proxy_pass에 호스트명을 그대로 쓰면 nginx가 "기동 시점"에 한 번만
    # 해석한다. 그러면 게이트웨이 컨테이너가 아직 안 떠 있을 때 nginx가
    # host not found in upstream 으로 아예 기동 실패하고, 게이트웨이가
    # 재생성되어 IP가 바뀌어도 죽은 IP로 계속 프록시한다.
    # 변수로 넘기면 resolver를 통해 매 요청마다 해석하므로 둘 다 피한다.
    #
    # 단, proxy_pass에 변수를 쓰면 URI 부분을 붙일 수 없다.
    # 경로를 바꿔야 하는 곳은 rewrite ... break 로 처리한다.
    # ---------------------------------------------------------------
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gw    mm-gateway-server:1882;
    set $admin mm-admin-service:1994;
    set $rag   web-rag:8001;

    # 호스트 nginx가 TLS를 종단하고 이 컨테이너로는 HTTP로 프록시하므로
    # $scheme이 항상 http다. 상대경로 return을 절대 URL로 펼치면 Location에
    # http:// 가 붙어 결제 페이지가 평문으로 한 번 떨어진다.
    # off로 두면 Location을 상대경로 그대로 내보내 브라우저가 https로 해석한다.
    absolute_redirect off;

    # ---------------------------------------------------------------
    # /manyman/ 결제 페이지 라우팅
    # ---------------------------------------------------------------

    location = /manyman/index.asp {
        return 302 /manyman/index-compact.html$is_args$args;
    }

    location = /manyman/authfrm.asp {
        return 302 /manyman/authfrm.html$is_args$args;
    }

    location = /manyman/dummy.asp {
        return 302 /manyman/dummy.html;
    }

    location = /manyman/KSPayRcv.asp {
        rewrite ^ /api/payment/kspayrec break;
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Content-Type      $http_content_type;
        proxy_pass_request_body on;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
    }

    location = /manyman/KSPayResult.asp {
        rewrite ^ /api/payment/kspayresult break;
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Content-Type      $http_content_type;
        proxy_pass_request_body on;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
    }

    location = /manyman/result.asp {
        rewrite ^ /api/payment/result break;
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Content-Type      $http_content_type;
        proxy_pass_request_body on;
    }

    location /manyman/ {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /manyman/index.html;
    }

    # ---------------------------------------------------------------
    # 자동업데이트 파일 다운로드 (정적 파일 직접 제공, SPA fallback 없음)
    # ---------------------------------------------------------------
    location /autoupdate/ {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # ---------------------------------------------------------------
    # *.asp 요청 → 홈 301 리다이렉트
    # (위의 location = /manyman/*.asp exact match들이 먼저 처리되므로 결제 경로는 영향 없음)
    # ---------------------------------------------------------------
    location ~* \.asp$ {
        return 301 /;
    }

    # ---------------------------------------------------------------
    # 검색엔진용 정적 파일 (SPA fallback 제외)
    # try_files ... =404 로 두어야 없을 때 index.html이 아니라 404가 나감
    # ---------------------------------------------------------------
    location = /robots.txt {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------------------------------------------------------------
    # 기본 SPA (React) 라우팅
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /work_down/ {
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header         Access-Control-Allow-Origin "*";
        add_header         Content-Disposition "attachment";
    }

    location /api/ {
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /oauth2/ {
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /images/pds/ {
        proxy_pass         http://$admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /images/ {
        proxy_pass         http://$gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # 챗봇 프록시 (web-rag:8001 → /chat/ 경로로 HTTPS 접근 가능)
    location /chat/ {
        rewrite ^/chat/(.*) /$1 break;
        proxy_pass         http://$rag;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
